name: Redirect G2-ZOO to APS-ZOO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=https://jikokennobun.github.io/APS-ZOO/">
            <link rel="canonical" href="https://jikokennobun.github.io/APS-ZOO/">
            <title>APS-ZOOへ移動しました</title>
          </head>
          <body>
            <p>この入口は削除しました。<a href="https://jikokennobun.github.io/APS-ZOO/">APS-ZOO</a> へ移動します。</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
