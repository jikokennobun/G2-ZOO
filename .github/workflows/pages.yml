name: Deploy APS-ZOO to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', '*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Set up Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Install TeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk texlive-luatex texlive-lang-japanese texlive-latex-recommended texlive-latex-extra texlive-pictures

      - name: Build
        run: stack build

      - name: Generate Zoo diagrams and reports
        run: |
          mkdir -p out
          stack exec g2-zoo
          stack exec g2-zoo -- auto
          stack exec g2-zoo -- proved
          stack exec g2-zoo -- matrix
          stack exec g2-zoo -- sep
          stack exec g2-zoo -- lattice
          stack exec g2-zoo -- classify
          stack exec g2-zoo -- guide
          stack exec g2-zoo -- g2chain
          stack exec g2-zoo -- algebra

      - name: Create TeX PDFs and pages
        shell: pwsh
        run: ./scripts/build_pages.ps1

      - name: Prune Pages artifact
        run: |
          rm -rf out/tex
          find out -maxdepth 1 -type f \
            ! -name 'index.html' \
            ! -name 'profile.html' \
            ! -name 'aps-zoo-head.jpg' \
            ! -name '*.pdf' \
            -delete
          find out -maxdepth 2 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
