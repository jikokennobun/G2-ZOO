name: Deploy G2-Zoo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', '*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: Set up Haskell (Stack)
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: 'latest'

      - name: Install Graphviz
        run: sudo apt-get install -y graphviz

      - name: Build
        run: stack build

      - name: Generate Zoo diagrams and reports
        run: |
          mkdir -p out
          stack exec g2-zoo
          stack exec g2-zoo -- auto
          stack exec g2-zoo -- proved
          stack exec g2-zoo -- matrix
          stack exec g2-zoo -- sep
          stack exec g2-zoo -- lattice
          stack exec g2-zoo -- classify
          stack exec g2-zoo -- guide
          stack exec g2-zoo -- g2chain
          stack exec g2-zoo -- algebra
          dot -Tpng out/zoo-proved.dot   -o out/zoo-proved.png
          dot -Tpng out/zoo-g2chain.dot  -o out/zoo-g2chain.png
          dot -Tpng out/zoo-algebra.dot  -o out/zoo-algebra.png

      - name: Create index.html
        run: |
          cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>G2-Zoo: APS 動物園</title>
            <style>
              body { background: #fff; color: #000; font-family: monospace;
                     line-height: 1.5; margin: 0 auto; max-width: 900px; padding: 1em 2em 3em; }
              h1 { font-size: 1.4em; margin: 0.3em 0 0.5em; }
              h2 { font-size: 1.1em; margin-top: 1.2em; border-bottom: 1px solid #000; padding-bottom: 0.1em; }
              a { color: #00f; }
              nav a { display: block; margin: 0.1em 0; }
              img { display: block; max-width: 100%; height: auto; border: 1px solid #ccc; margin: 0.5em 0; }
              ul { margin-top: 0.3em; }
            </style>
          </head>
          <body>
            <h1>抽象的証明可能体系動物園 (Zoo of APS)</h1>
            <p>APS (Abstract Provability Structure) 周辺の命題間の含意関係を整理したページ。
            Beklemishev &amp; Shamkanov (2016) と渋谷個別セミナー (2026) のメモに基づく。</p>

            <nav>
              <a href="https://jikokennobun.github.io/">&larr; 自己嫌悪文のページへ戻る</a>
            </nav>

            <h2>分類図</h2>
            <img src="zoo-proved.png" alt="APS 動物園：成立した含意の分類図">

            <h2>ページ一覧</h2>
            <nav>
              <a href="zoo-lattice.html">格子図ビュー</a>
              <a href="zoo-g2chain.html">G2-FG2 階層図</a>
              <a href="zoo-algebra.html">代数系階層図</a>
              <a href="zoo-classify.html">有限モデル分類データベース</a>
              <a href="zoo-guide.html">有限 APS モデル構成ガイド</a>
              <a href="zoo-matrix.html">含意行列</a>
              <a href="counterexamples.html">反例モデルカード</a>
            </nav>

            <h2>テキストデータ</h2>
            <ul>
              <li><a href="zoo-proved.dot">zoo-proved.dot</a> / <a href="zoo-proved.tex">zoo-proved.tex</a> / <a href="zoo-proved-notes.md">zoo-proved-notes.md</a></li>
              <li><a href="zoo.dot">zoo.dot</a> / <a href="zoo.tex">zoo.tex</a> / <a href="zoo-notes.md">zoo-notes.md</a></li>
              <li><a href="zoo-auto.dot">zoo-auto.dot</a> / <a href="zoo-auto.tex">zoo-auto.tex</a> / <a href="zoo-auto-notes.md">zoo-auto-notes.md</a></li>
              <li><a href="zoo-g2chain.dot">zoo-g2chain.dot</a></li>
              <li><a href="zoo-algebra.dot">zoo-algebra.dot</a></li>
            </ul>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
